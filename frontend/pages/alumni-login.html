<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alumni Portal — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/login-style.css">
</head>
<body>

<div class="page">
  <div class="card">

    <!-- Left -->
    <div class="left-panel">
      <p class="welcome-heading">Welcome! <span class="name"> TSUsian</span></p>
      <p class="welcome-sub">
        to Alumni Portal. Reconnect with your Peers,<br>
        explore exclusive recommendations, and manage<br>
        your professional background.
      </p>
    </div>

    <!-- Right -->
    <div class="right-panel">
      <h1 class="login-title">Login</h1>
      <div class="title-underline"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrap">
          <!-- @ icon -->
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
          </svg>
          <input type="email" id="email" placeholder="ex. jl.delacruz@student.tsu.edu.ph" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <div class="password-row">
          <label for="password">Password</label>
          
        </div>
        <div class="input-wrap">
          <!-- lock icon -->
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <a href="alumni-reset-pass.html" class="forgot-link">Forgot Password?</a>
      </div>



      <div id="msg-box" style="display:none;padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:12px;text-align:center;"></div>

      <button class="btn-signin" id="login-btn" type="button" onclick="doLogin()">
        Login
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>
      <div class="login-link-row" style="text-align:center;margin-top:12px;font-size:14px;color:#555;">
        Don't have an account? <a href="alumni-signup.html" style="color:#7B1A2E;font-weight:700;">Sign Up</a>
      </div>
      <div class="links-row">
        <a href="#">Privacy Policy</a>
        <a href="#">About us</a>
      </div>

    </div>

  </div>
</div>

<footer>© 2026 Alumni Portal &nbsp;·&nbsp; Tarlac State University </footer>

<script>
  const API = 'http://localhost:5000/api';

  function showMsg(text, isError = true) {
    const box = document.getElementById('msg-box');
    box.textContent = text;
    box.style.display = 'block';
    box.style.background = isError ? '#fff5f5' : '#f0fff4';
    box.style.color = isError ? '#c53030' : '#276749';
    box.style.border = `1px solid ${isError ? '#fc8181' : '#68d391'}`;
  }

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) return showMsg('Please enter your email and password.');

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.firstChild.textContent = 'Signing in… ';

    try {
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        showMsg(data.message || 'Login failed.');
        btn.disabled = false;
        btn.firstChild.textContent = 'Login ';
        return;
      }

      if (data.twoFactorRequired) {
        sessionStorage.setItem('tfa_temp_token', data.tempToken);
        window.location.href = 'alumni-2fa.html';
        return;
      }

      localStorage.setItem('auth_token', data.token);
      localStorage.setItem('auth_user', JSON.stringify(data.user));
      showMsg('Login successful! Redirecting…', false);
      // TODO: replace with your dashboard page
      setTimeout(() => showMsg(`Welcome back, ${data.user.firstName}! (Dashboard coming soon)`, false), 1500);
    } catch {
      showMsg('Could not connect to server. Make sure the backend is running.');
      btn.disabled = false;
      btn.firstChild.textContent = 'Login ';
    }
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });
</script>

</body>
</html>
