<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alumni Portal — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/login-style.css">
</head>
<body>

<div class="page">
  <div class="card">

    <!-- Left -->
    <div class="left-panel">
      <p class="welcome-heading">Welcome! <span class="name"> TSUsian</span></p>
      <p class="welcome-sub">
        to Alumni Portal. Reconnect with your Peers,<br>
        explore exclusive recommendations, and manage<br>
        your professional background.
      </p>
    </div>

    <!-- Right -->
    <div class="right-panel">
      <h1 class="login-title">Login</h1>
      <div class="title-underline"></div>

      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrap">
          <!-- @ icon -->
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
          </svg>
          <input type="email" id="email" placeholder="ex. jl.delacruz@student.tsu.edu.ph" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <div class="password-row">
          <label for="password">Password</label>
          
        </div>
        <div class="input-wrap">
          <!-- lock icon -->
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <a href="alumni-reset-pass.html" class="forgot-link">Forgot Password?</a>
      </div>



      <button class="btn-signin" type="button">
        Login
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>
      <div class="links-row">
        <a href="#">Privacy Policy</a>
        <a href="#">About us</a>
      </div>

    </div>

  </div>
</div>

<footer>© 2026 Alumni Portal &nbsp;·&nbsp; Tarlac State University </footer>

</body>
</html>
