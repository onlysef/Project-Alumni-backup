<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSU Alumni Portal — Partner Registration</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/signup-style.css">
</head>
<body>

<div class="page">
  <div class="card">

    <!-- Left -->
    <div class="left-panel">
      <p class="welcome-heading">Partner<br><span class="name">Registration</span></p>
      <p class="welcome-sub">
        Register as a TSU partner to post<br>
        job opportunities, connect with<br>
        graduates, and collaborate with<br>
        Tarlac State University.
      </p>
    </div>

    <!-- Right -->
    <div class="right-panel">
      <h1 class="login-title">Sign Up</h1>
      <div class="title-underline"></div>

      <div id="error-msg" class="error-banner" style="display:none"></div>
      <div id="success-msg" class="success-banner" style="display:none"></div>

      <!-- Name row -->
      <div class="form-row">
        <div class="form-group">
          <label for="firstname">First Name</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <input type="text" id="firstname" placeholder="ex. Juan" autocomplete="given-name">
          </div>
        </div>
        <div class="form-group">
          <label for="lastname">Last Name</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
            </svg>
            <input type="text" id="lastname" placeholder="ex. dela Cruz" autocomplete="family-name">
          </div>
        </div>
      </div>

      <!-- Company -->
      <div class="form-group">
        <label for="company">Company / Organization Name</label>
        <div class="input-wrap">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
          </svg>
          <input type="text" id="company" placeholder="ex. Accenture Philippines" autocomplete="organization">
        </div>
      </div>

      <!-- Partnership Type -->
      <div class="form-group">
        <label for="partnertype">Partnership Type</label>
        <div class="select-wrap">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <select id="partnertype">
            <option value="" disabled selected>Select type</option>
            <option value="Industry">Industry</option>
            <option value="Academe">Academe</option>
            <option value="Government">Government</option>
            <option value="NGO">NGO</option>
          </select>
          <svg class="select-arrow" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrap">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
          </svg>
          <input type="email" id="email" placeholder="ex. hr@company.com" autocomplete="email">
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" oninput="updateStrength(this.value)">
        </div>
        <div class="password-strength" id="strength-bars">
          <div class="strength-bar" id="bar1"></div>
          <div class="strength-bar" id="bar2"></div>
          <div class="strength-bar" id="bar3"></div>
          <div class="strength-bar" id="bar4"></div>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmpassword">Confirm Password</label>
        <div class="input-wrap">
          <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
          <input type="password" id="confirmpassword" placeholder="Re-enter your password" autocomplete="new-password">
        </div>
      </div>

      <button class="btn-signin" type="button" id="submit-btn" onclick="handleRegister()">
        Submit Registration
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
        </svg>
      </button>

      <div class="login-link-row">
        Already have an account? <a href="alumni-login.html">Login</a>
      </div>

      <div class="links-row">
        <a href="#">Privacy Policy</a>
        <a href="#">About us</a>
      </div>
    </div>

  </div>
</div>

<footer>© 2026 Alumni Portal &nbsp;·&nbsp; Tarlac State University</footer>

<script>
  const API = 'http://localhost:5000/api';

  function updateStrength(val) {
    let score = 0;
    if (val.length >= 8)              score++;
    if (/[A-Z]/.test(val))           score++;
    if (/[0-9]/.test(val))           score++;
    if (/[^A-Za-z0-9]/.test(val))    score++;
    const colors = ['', '#e53935', '#fb8c00', '#fdd835', '#43a047'];
    for (let i = 1; i <= 4; i++) {
      const bar = document.getElementById('bar' + i);
      bar.style.background = i <= score ? colors[score] : '#e0e0e0';
    }
  }

  async function handleRegister() {
    const btn        = document.getElementById('submit-btn');
    const errorEl    = document.getElementById('error-msg');
    const successEl  = document.getElementById('success-msg');
    errorEl.style.display   = 'none';
    successEl.style.display = 'none';

    const firstName       = document.getElementById('firstname').value.trim();
    const lastName        = document.getElementById('lastname').value.trim();
    const company         = document.getElementById('company').value.trim();
    const partnerType     = document.getElementById('partnertype').value;
    const email           = document.getElementById('email').value.trim();
    const password        = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmpassword').value;

    if (!firstName || !lastName || !company || !partnerType || !email || !password || !confirmPassword) {
      errorEl.textContent = 'Please fill in all fields.';
      errorEl.style.display = 'block';
      return;
    }
    if (password !== confirmPassword) {
      errorEl.textContent = 'Passwords do not match.';
      errorEl.style.display = 'block';
      return;
    }
    if (password.length < 8) {
      errorEl.textContent = 'Password must be at least 8 characters.';
      errorEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting…';

    try {
      const res  = await fetch(`${API}/auth/register-partner`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ firstName, lastName, company, partnerType, email, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.message || 'Registration failed.';
        errorEl.style.display = 'block';
      } else {
        successEl.textContent = data.message;
        successEl.style.display = 'block';
        document.querySelector('.right-panel form') && document.querySelector('.right-panel form').reset();
      }
    } catch {
      errorEl.textContent = 'Could not connect to server. Please try again.';
      errorEl.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Submit Registration <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
    }
  }
</script>

</body>
</html>
