<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alumni Portal - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/login-style.css">
  <script src="/config.js"></script>
</head>
<body>
<video class="page-bg-video" muted playsinline preload="none" poster="/assets/images/alumni-center.jpg?v=2" data-src="/assets/videos/login-bg.mp4" aria-hidden="true" tabindex="-1"></video>
<script src="/assets/js/bg-video.js?v=3" defer></script>


  <main class="page">
    <div class="card">

      <section class="left-panel">
        <div class="welcome-copy">
          <div class="welcome-banner">
            <div class="welcome-banner-logos">
              <img src="/assets/images/tsu-logo.png" alt="Tarlac State University" width="64" height="64">
              <img src="/assets/images/alumni-logo.png" alt="TSU Alumni Association" width="64" height="64">
            </div>
          </div>
          <div class="welcome-wave" aria-hidden="true">
            <span class="wave-hand-image"></span>
            <span class="wave-pop-lines wave-pop-left"><i></i><i></i></span>
            <span class="wave-pop-lines wave-pop-right"><i></i><i></i></span>
          </div>
          <p class="welcome-heading">Welcome! <span class="name">TSUsian</span></p>
          <p class="welcome-sub">
            to Alumni Portal, Reconnect with your Peers,<br>
            explore exclusive recommendations, and manage<br>
            your professional background.
          </p>
        </div>
      </section>

      <section class="right-shell">
        <div class="right-panel">
          <h1 class="login-title">Login</h1>
          <div class="title-underline"></div>

          <div class="form-group">
            <label for="email">Email</label>
            <div class="input-wrap">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
              </svg>
              <input type="email" id="email" placeholder="alumni.id@tsu.edu.ph" autocomplete="email">
            </div>
          </div>

          <div class="form-group password-group">
            <div class="password-row">
              <label for="password">Password</label>
              <a href="alumni-reset-pass.html" class="forgot-link">Forgot Password?</a>
            </div>
            <div class="input-wrap">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
              </svg>
              <input type="password" id="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password">
              <button type="button" class="toggle-password" aria-label="Show password" data-target="password">
                <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" style="display:none">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M10.6 10.6a3 3 0 004.2 4.2M9.4 5.7A9.3 9.3 0 0112 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 01-3 3.6M6.1 6.6A16 16 0 002.5 12S6 18.5 12 18.5a9 9 0 003.4-.65"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="links-row">
            <button type="button" class="info-link" onclick="openInfoModal('privacy')">Privacy Policy</button>
            <button type="button" class="info-link" onclick="openInfoModal('about')">About us</button>
          </div>

          <button class="btn-signin" id="login-btn" type="button" onclick="doLogin()">
            Log in
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/>
            </svg>
          </button>

          <p class="signup-prompt" style="text-align:center;font-size:13px;margin-top:16px;color:#76656a;">
            New alumnus? <a id="signup-link" href="#" style="color:#570013;font-weight:700;text-decoration:none;">Create an account</a>
          </p>

        </div>
      </section>
    </div>
  </main>
  <footer class="login-footer">&copy; 2026 Alumni Portal &middot; Tarlac State University | College of Computer Studies</footer>

  <div class="info-modal" id="info-modal" role="dialog" aria-modal="true" aria-labelledby="info-modal-title" hidden>
    <div class="info-modal-backdrop" onclick="closeInfoModal()"></div>
    <section class="info-modal-card">
      <button type="button" class="info-modal-close" onclick="closeInfoModal()" aria-label="Close popup">&times;</button>
      <h2 id="info-modal-title"></h2>
      <div class="info-modal-underline"></div>
      <div id="info-modal-content"></div>
    </section>
  </div>

  <script>
    const API = window.APP_CONFIG.API;
    const APP = window.APP_CONFIG.APP;

    document.getElementById('signup-link').href = `${APP}/signup`;

    function showMsg(text, isError = true) {
      let box = document.getElementById('msg-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'msg-box';
        box.style.padding = '10px 14px';
        box.style.borderRadius = '8px';
        box.style.fontSize = '14px';
        box.style.marginBottom = '12px';
        box.style.textAlign = 'center';
        document.querySelector('.btn-signin').insertAdjacentElement('beforebegin', box);
      }
      box.textContent = text;
      box.style.display = 'block';
      box.style.background = isError ? '#fff5f5' : '#f0fff4';
      box.style.color = isError ? '#c53030' : '#276749';
      box.style.border = `1px solid ${isError ? '#fc8181' : '#68d391'}`;
    }

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) return showMsg('Please enter your email and password.');

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      const original = btn.innerHTML;
      btn.textContent = 'Signing in...';

      const warmupTimer = setTimeout(() => {
        btn.textContent = 'Server warming up, please wait…';
      }, 6000);

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        clearTimeout(warmupTimer);
        const data = await res.json();

        if (!res.ok) {
          showMsg(data.message || 'Login failed.');
          btn.disabled = false;
          btn.innerHTML = original;
          return;
        }

        if (data.twoFactorRequired) {
          sessionStorage.setItem('tfa_temp_token', data.tempToken);
          sessionStorage.setItem('tfa_code_sent', 'true');
          sessionStorage.setItem('tfa_code_sent_at', String(Date.now()));
          window.location.href = 'alumni-2fa.html';
          return;
        }

        const dashboardMap = {
          admin: `${APP}/admin/dashboard`,
          alumni: `${APP}/alumni/dashboard`,
          coordinator: `${APP}/coordinator/dashboard`,
          employer: `${APP}/employer/dashboard`,
        };
        const base = dashboardMap[data.user.role] || APP;
        const payload = encodeURIComponent(JSON.stringify({ token: data.token, user: data.user, firstLogin: data.firstLogin }));
        window.location.href = `${base}#auth=${payload}`;
      } catch {
        clearTimeout(warmupTimer);
        showMsg('Could not connect to server. Please try again.');
        btn.disabled = false;
        btn.innerHTML = original;
      }
    }

    document.getElementById('email').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('password').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });

    document.querySelectorAll('.toggle-password').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var input = document.getElementById(btn.dataset.target);
        var open = btn.querySelector('.eye-open');
        var closed = btn.querySelector('.eye-closed');
        var hidden = input.type === 'password';
        input.type = hidden ? 'text' : 'password';
        open.style.display = hidden ? 'none' : 'block';
        closed.style.display = hidden ? 'block' : 'none';
        btn.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
      });
    });

    const FB_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.5h-2.8V24C19.62 23.1 24 18.1 24 12.07"/></svg>';
    const WEB_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>';
    const ABOUT_LINKS_HTML = `
      <div class="info-modal-links" aria-label="Official TSU pages">
        <a href="https://www.facebook.com/TarlacStateU" target="_blank" rel="noopener noreferrer">${FB_ICON}<span>Tarlac State University</span></a>
        <a href="https://www.facebook.com/TSUAAI" target="_blank" rel="noopener noreferrer">${FB_ICON}<span>TSU Alumni Association</span></a>
        <a href="https://www.tsu.edu.ph/" target="_blank" rel="noopener noreferrer">${WEB_ICON}<span>tsu.edu.ph</span></a>
      </div>`;

    const infoModalContent = {
      privacy: {
        title: 'Privacy Policy',
        content: `
          <p>The Alumni Portal respects and protects your personal information in accordance with Republic Act No. 10173, or the Data Privacy Act of 2012.</p>
          <p>Information you provide may be used to verify your identity, manage your account, deliver alumni services, support tracer studies, improve university programs, and maintain portal security.</p>
          <p>Your information will only be accessed by authorized personnel, retained only as necessary, and protected using reasonable organizational, physical, and technical safeguards. It will not be sold.</p>
          <p>You may request access to or correction of your information, object to processing, withdraw consent where applicable, or exercise other rights provided by law through the Alumni Affairs Office or the university's designated Data Protection Officer.</p>
        `
      },
      about: {
        title: 'About Us',
        content: `
          <p>The Alumni Portal helps Tarlac State University graduates stay connected with the university and their fellow alumni.</p>
          <p>Through the portal, alumni can maintain their professional information, participate in tracer studies, discover career opportunities, receive announcements, and engage with university events and services.</p>
          <p>Our goal is to support lifelong connections, professional growth, and continuous improvement of programs for the TSU alumni community.</p>
          ${ABOUT_LINKS_HTML}
        `
      }
    };

    function openInfoModal(type) {
      const data = infoModalContent[type];
      if (!data) return;
      const modal = document.getElementById('info-modal');
      document.getElementById('info-modal-title').textContent = data.title;
      document.getElementById('info-modal-content').innerHTML = data.content;
      modal.hidden = false;
      document.body.classList.add('modal-open');
      modal.querySelector('.info-modal-close').focus();
    }

    function closeInfoModal() {
      document.getElementById('info-modal').hidden = true;
      document.body.classList.remove('modal-open');
    }

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !document.getElementById('info-modal').hidden) {
        closeInfoModal();
      }
    });
  </script>
</body>
</html>
